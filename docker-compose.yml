services:
  indexer:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/workspace
      - m2:/m2
      - ${WARC_DIR:-./data}:/data:ro
      - ${OUT_DIR:-./out}:/out
    working_dir: /workspace
    cpus: ${INDEXER_CPUS:-2}
    mem_limit: ${INDEXER_MEM:-3g}

volumes:
  m2:
